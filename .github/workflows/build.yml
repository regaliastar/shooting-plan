name: Build and sync photography site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run typecheck
      - uses: actions/upload-artifact@v4
        with:
          name: photography-site
          path: dist
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: site-content
          path: .sites-runtime/catalog.json
          include-hidden-files: true
  publish-content:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-content
          path: publish-input
      - uses: actions/github-script@v8
        with:
          script: |
            const publish = require('./scripts/publish-content.cjs');
            await publish({github, context, core});
